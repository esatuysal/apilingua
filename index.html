<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apilingua Writing Activities - Ödev Teslimi</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 51, 0.75);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .slide {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .container {
            max-width: 900px;
            width: 100%;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .meta-info {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            color: var(--text-sub);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }

        .meta-item strong {
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .card h2 {
            font-size: 1.3rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .img-wrapper {
            width: 100%;
            max-height: 70vh;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }

        .scroll-hint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-sub);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -10px); }
            60% { transform: translate(-50%, -5px); }
        }
    </style>
</head>
<body>

    <!-- Slayt 1: Başlık -->
    <section class="slide">
        <div class="container">
            <div class="header">
                <span class="badge">LEVEL 1-15 (HAZIRLIK)</span>
                <h1>SELF-STUDY TASKS<br>Apilingua Writing Activities A1 LEVEL<br>Sentence Structure A1-A23</h1>
                
                <div class="meta-info">
                    <div class="meta-item">Eğitmen: <strong>HAMDI A S JARADA</strong></div>
                    <div class="meta-item">Teslim Tarihi: <strong>18 Ekim 2026, 23:59</strong></div>
                    <div class="meta-item">Puan: <strong>100 Puan</strong></div>
                </div>
            </div>
        </div>
        <div class="scroll-hint">▼ Aşağı Kaydır</div>
    </section>

    <!-- Slayt 2: Resim 1 -->
    <section class="slide">
        <div class="container">
            <div class="card">
                <h2>Ekran Görüntüsü 1 — Çalışma Görseli</h2>
                <div class="img-wrapper">
                    <img src="Ekran Resmi 2026-10-17 10.58.34.png" alt="Ödev Ekran Görüntüsü 1">
                </div>
            </div>
        </div>
        <div class="scroll-hint">▼ Aşağı Kaydır</div>
    </section>

    <!-- Slayt 3: Resim 2 -->
    <section class="slide">
        <div class="container">
            <div class="card">
                <h2>Ekran Görüntüsü 2 — Çalışma Görseli</h2>
                <div class="img-wrapper">
                    <img src="Ekran Resmi 2026-10-17 10.58.57.png" alt="Ödev Ekran Görüntüsü 2">
                </div>
            </div>
        </div>
    </section>

</body>
</html>
